name: Security and build checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json

      - name: Create non-production Firebase configuration
        run: cp app/google-services.example.json app/google-services.json

      - name: Scan repository history for credentials
        run: bash scripts/security_scan.sh

      - name: Verify Android project
        run: ./gradlew testDebugUnitTest lintDebug compileDebugAndroidTestKotlin assembleDebug assembleRelease --console=plain

      - name: Install Firebase rules test dependencies
        working-directory: firebase-tests
        run: npm ci --ignore-scripts

      - name: Audit Firebase test dependencies
        working-directory: firebase-tests
        run: npm audit --audit-level=high

      - name: Test Realtime Database rules
        working-directory: firebase-tests
        run: npm run test:emulator

      - name: Scan packaged APK
        run: bash scripts/security_scan.sh
